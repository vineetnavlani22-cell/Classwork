<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML: Tables</title>
</head>
<body>
    <table border="2px"
        <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Date OF Birth</th>
            </tr>
            <tr>
                <td>Bill Gates</td>
                <td>Microsoft</td>
                <td>1955</td>
            </tr>
            <tr>
                <td>Mark</td>
                <td>Facebook</td>
                <td>1984</td>
    </table>
</body>
</html>
