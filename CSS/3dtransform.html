<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: 3dtransform</title>
    <style>
        /*
        element
        rotate-ghumana
        scale-scale
        translate-khiskanaq
        skew-tircha
        X or Y (2dimensions)
        translate(x,y)- move
        rotate(angle) - rotate clockwise
        scale(x,y) - resize
        skew(x-angle,y-angle)-skew(title) the element along
        matrix(a,b,c,d,e,f)-combine al above in one function
        */
        /*
        3d transform element - X,Y and Z axis -depth
        rotateX
        rotateY
        rotateZ
        translate 
         */
         .blue{
            background-color:blue;
            color:white;
            height:100px;
            width:auto;
            transform: rotate(45degree)
        }
        .yellow{
            background-color: yellow;
            color:white;
            height:100px;
            width:auto;
            transform: rotate(60degree);

        }
        .red{
            background-color:red;
            color:white;
            height:100px;
            width:auto;
            transform: rotateY(30degree);
    </style>
 </head>
 <body>
     <div class="blue">Facebook</div>
    <p><a href="https://WWW.amazon.in">Visit Link</a></p>
</div>
     <div class="yellow">Microsoft</div>
    <p><a href="https://WWW.ebay.in">Visit Link</a></p>
</div>
     <div class="red">Apple</div>
    <p><a href="https://WWW.aeeron.in">Visit Link</a></p>
</div>
</body>
</html>
