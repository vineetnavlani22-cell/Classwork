<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: Gradients</title>
    <style>
         .blue{
            background-color:blue;
            color:white;
            height:100px;
            width:auto;
            background: linear-gradient(blue,white)
        }
        .yellow{
            background-color: yellow;
            color:white;
            height:100px;
            width:auto;
            background: linear-gradient(red,yellow)
        }
        .red{
            background-color:red;
            color:white;
            height:100px;
            width:auto;
            background: linear-gradient(to right,blue,white,red,green);
        }
    </style>
</head>
<body>
    <div class="blue">Facebook</div>
    <p><a href="https://WWW.amazon.in">Visit Link</a></p>
</div>
     <div class="yellow">Microsoft</div>
    <p><a href="https://WWW.ebay.in">Visit Link</a></p>
</div>
     <div class="red">Apple</div>
    <p><a href="https://WWW.aeeron.in">Visit Link</a></p>
</div>
</body>
</html>
